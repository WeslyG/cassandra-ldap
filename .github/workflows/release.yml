name: Verified Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  # A new push supersedes verification of an unpublished candidate; manual retries queue.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Build and check six adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag identity and tooling
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          docker version --format '{{.Server.Version}}'
      - name: Build artifacts and run fast checks
        run: make verify-fast
      - name: Package only verified jars
        run: make release-package
      - name: Transfer the verified download set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/${{ env.RELEASE_TAG }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified assets
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the same release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the verified set from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/${{ env.RELEASE_TAG }}/
      - name: Upload, verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish_release.sh
