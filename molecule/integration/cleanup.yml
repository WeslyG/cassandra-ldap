- name: Preserve cluster evidence before teardown
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Collect logs from both Cassandra nodes and LDAP
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ playbook_dir }}/compose.yaml", logs, --no-color]
      register: cluster_logs
      changed_when: false
      failed_when: false
    - name: Save per-version cluster logs
      ansible.builtin.copy:
        content: "{{ cluster_logs.stdout }}\n{{ cluster_logs.stderr }}"
        dest: "{{ playbook_dir }}/.state/{{ lookup('env', 'CASSANDRA_VERSION') | default('current', true) }}-containers.log"
        mode: '0644'
    - name: Collect systemd service journals
      ansible.builtin.command:
        argv: [docker, compose, -f, "{{ playbook_dir }}/compose.yaml", exec, -T, "{{ item }}", journalctl, -u, cassandra, --no-pager]
      loop: [cassandra1, cassandra2]
      register: systemd_journals
      changed_when: false
      failed_when: false
      when: lookup('env', 'LDAP_TEST_SYSTEMD') == 'true'
    - name: Save systemd journals
      ansible.builtin.copy:
        content: "{{ systemd_journals.results | map(attribute='stdout') | join('\n') }}"
        dest: "{{ playbook_dir }}/.state/{{ lookup('env', 'CASSANDRA_VERSION') | default('current', true) }}-systemd.log"
        mode: '0644'
      when: lookup('env', 'LDAP_TEST_SYSTEMD') == 'true'
